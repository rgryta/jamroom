name: PR validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        # Match the Rust minor version in Dockerfile.
        run: rustup toolchain install 1.94 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.94 fmt --all --check
      - name: Run Clippy
        run: cargo +1.94 clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo +1.94 test --locked
