services:
  jamroom:
    image: ghcr.io/rgryta/jamroom:0.2.0
    container_name: jamroom
    restart: unless-stopped
    user: "3001:3000"
    group_add:
      - "950"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      TZ: Europe/Warsaw
      RUST_LOG: info
      JAM_DEFAULT_ROOM: Office
    tmpfs:
      - /tmp
    volumes:
      - jam_data:/data
      - jam_music:/music:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    networks:
      unsafe-network:
        ipv4_address: 172.20.1.4
    labels:
      - traefik.enable=true
      - autoheal=true
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.jamroom
      - traefik.http.routers.jamroom.rule=Host(`jam.gryta.eu`)
      - traefik.http.routers.jamroom.entrypoints=websecure
      - traefik.http.routers.jamroom.tls.certresolver=le
      - traefik.http.routers.jamroom.middlewares=jamroom-per-ip
      - traefik.http.middlewares.jamroom-per-ip.inFlightReq.amount=20
      - traefik.http.middlewares.jamroom-per-ip.inFlightReq.sourceCriterion.ipStrategy.depth=0
      - traefik.http.services.jamroom.loadbalancer.server.port=8080
  jamroom-soulseek:
    image: ghcr.io/rgryta/jamroom:0.2.0
    container_name: jamroom-soulseek
    command: ["upgrade"]
    restart: unless-stopped
    user: "3001:3000"
    group_add:
      - "950"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Warsaw
      RUST_LOG: info
      JAM_SLSKD_URL: http://vpn-client:5030
      JAM_SLSK_DOWNLOADS: /slsk
    tmpfs:
      - /tmp
    volumes:
      - jam_data:/data
      - jam_music:/music
      - slsk_complete:/slsk:ro
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.11
    labels:
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.jamroom
volumes:
  jam_data:
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/jamroom
  jam_music:
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/media/Music
  slsk_complete:
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/apps/volumes/slskd/downloads/complete
networks:
  unsafe-network:
    name: unsafe-network
    external: true
  homelab-vpn-network:
    name: homelab-vpn-network
    external: true
