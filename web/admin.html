<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a45e0'/%3E%3Ccircle cx='12.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='19.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
<style>
  .room-card { padding: 12px 0; border-top: 1px solid var(--line); }
  .room-card:first-child { border-top: 0; }
  .room-card.revoked { opacity: .65; }
  .room-card .t { font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--mut); font-size: var(--t2); font-weight: 400; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0 -14px; }
  dialog p { margin: 0 0 16px; }
  dialog .btns { justify-content: flex-end; margin-left: 0; }
  .stat { color: var(--mut); font-size: var(--t2); margin: 0; }
</style>
</head>
<body>
<header class="top"><a class="mark" href="/"><svg viewBox="0 0 28 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="18" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>jamroom</a></header>
<main class="wrap">
  <h1>Rooms</h1>

  <form id="tok" class="addbar">
    <input id="token" type="password" autocomplete="current-password" placeholder="Admin token" aria-label="Admin token" required>
    <button class="btn">Unlock</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div id="panel" hidden>
    <form id="new" class="addbar">
      <input id="name" maxlength="40" placeholder="New room name" aria-label="New room name" autocomplete="off" required>
      <button class="btn">Create</button>
    </form>
    <div class="sec"><h2>All rooms</h2><span class="stat" id="lib"></span></div>
    <ul class="list" id="rooms"></ul>
  </div>
</main>

<dialog class="sheet" id="ask" aria-labelledby="ask-h">
  <div class="sheet-head"><h2 id="ask-h"></h2></div>
  <p id="ask-p"></p>
  <div class="btns">
    <button class="btn quiet" id="keep" type="button">Keep room</button>
    <button class="btn" id="drop" type="button">Revoke room</button>
  </div>
</dialog>

<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el } = Jam;
  const $ = (id) => document.getElementById(id);
  let token = '';
  try { token = sessionStorage.getItem('jam-admin') || ''; } catch (e) {}
  const say = (text, cls) => { $('msg').textContent = text; $('msg').className = 'msg ' + (cls || ''); };

  const call = async (path, method = 'GET', body) => {
    const r = await fetch('/api/admin' + path, {
      method,
      headers: { authorization: 'Bearer ' + token, ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), { status: r.status });
    return j;
  };

  const copy = (btn, text) => navigator.clipboard.writeText(text).then(() => {
    const was = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = was; }, 1500);
  }).catch(() => say('Copying is blocked here. Select the link by hand instead.', 'err'));

  const confirmRevoke = (room) => new Promise((resolve) => {
    $('ask-h').textContent = `Revoke “${room.name}”?`;
    $('ask-p').textContent = 'Its links stop working straight away. This can’t be undone.';
    const done = (yes) => { $('ask').close(); $('keep').onclick = $('drop').onclick = null; resolve(yes); };
    $('keep').onclick = () => done(false);
    $('drop').onclick = () => done(true);
    $('ask').showModal();
  });

  const draw = (data) => {
    $('lib').textContent = `${data.library_tracks.toLocaleString()} songs indexed`;
    const ul = $('rooms'); ul.textContent = '';
    if (!data.rooms.length) ul.append(el('li', 'empty', 'No rooms yet.'));
    data.rooms.forEach((r) => {
      const li = el('li', 'room-card' + (r.revoked ? ' revoked' : ''));
      const t = el('div', 't', r.name);
      t.append(el('span', 'code', r.code), el('span', 'code', r.revoked ? 'revoked' : new Date(r.created_at * 1000).toLocaleDateString()));
      const btns = el('div', 'btns');
      if (!r.revoked) {
        const link = `${location.origin}/r/${r.code}`;
        const add = el('button', 'btn quiet sm', 'Copy add link'); add.type = 'button';
        add.addEventListener('click', () => copy(add, link));
        const player = el('button', 'btn quiet sm', 'Copy player link'); player.type = 'button';
        player.addEventListener('click', () => copy(player, `${link}/player`));
        const revoke = el('button', 'btn warn sm', 'Revoke'); revoke.type = 'button';
        revoke.setAttribute('aria-label', `Revoke ${r.name}`);
        revoke.addEventListener('click', async () => {
          if (await confirmRevoke(r)) call(`/rooms/${r.code}`, 'DELETE').then(load).catch((e) => say(e.message, 'err'));
        });
        btns.append(add, player, revoke);
      }
      li.append(t, btns);
      ul.append(li);
    });
  };

  const load = async () => {
    try {
      draw(await call('/rooms'));
      $('tok').hidden = true; $('panel').hidden = false; say('');
      try { sessionStorage.setItem('jam-admin', token); } catch (e) {}
    } catch (e) {
      $('tok').hidden = false; $('panel').hidden = true;
      if (token) say(e.status === 401 ? 'That token isn’t right.' : e.status === 429 ? 'Too many tries. Wait a minute.' : e.message, 'err');
      try { sessionStorage.removeItem('jam-admin'); } catch (e2) {}
    }
  };

  $('tok').addEventListener('submit', (e) => { e.preventDefault(); token = $('token').value; load(); });
  $('new').addEventListener('submit', (e) => {
    e.preventDefault();
    call('/rooms', 'POST', { name: $('name').value }).then(() => { $('name').value = ''; return load(); }).catch((err) => say(err.message, 'err'));
  });
  if (token) load();
})();
</script>
</body>
</html>
