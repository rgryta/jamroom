<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a45e0'/%3E%3Ccircle cx='12.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='19.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
<style>
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 0; }
  .title-row h1 { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top">
  <a class="mark" href="/"><svg viewBox="0 0 28 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="18" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>jamroom</a>
  <span class="grow"></span>
  <a class="icon-btn" id="player" href="#" aria-label="Open the player" title="Open the player"></a>
</header>
<main class="wrap">
  <div class="title-row"><h1 id="room">Jam</h1><span id="radio"></span></div>

  <div id="now"></div>

  <form id="f" class="addbar">
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="Paste a link or type a song" aria-label="Add a song" required>
    <button class="btn" id="add">Add</button>
  </form>
  <details class="name">
    <summary id="who">Add your name</summary>
    <input id="nm" maxlength="40" autocomplete="nickname" placeholder="Your name" aria-label="Your name">
  </details>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <section aria-labelledby="h-q">
    <div class="sec"><h2 id="h-q">Up next <span class="count" id="qn"></span></h2></div>
    <ol class="list" id="q"></ol>
  </section>
  <details class="recent">
    <summary>Played recently</summary>
    <ul class="list" id="recent"></ul>
  </details>
</main>
<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el, sleeve, stateTag, icon, iconButton, setIcon } = Jam;
  const code = location.pathname.split('/')[2];
  const api = Jam.roomApi(code);
  const $ = (id) => document.getElementById(id);
  $('player').href = `/r/${code}/player`;
  $('player').append(icon('speaker'));

  const say = (text, cls) => { $('msg').textContent = text; $('msg').className = 'msg ' + (cls || ''); };
  const showName = () => { const n = $('nm').value.trim(); $('who').textContent = n ? `Adding as ${n}` : 'Add your name'; };
  try { $('nm').value = localStorage.getItem('jam-name') || ''; } catch (e) {}
  showName();
  $('nm').addEventListener('input', showName);

  const fail = (e) => say(e.message, 'err');
  const sub = (t) => [t.artist, t.added_by && `added by ${t.added_by}`].filter(Boolean).join(' · ');

  // The song that is playing: cover, title, a thin progress line and the two controls.
  const nowRow = (t) => {
    const box = el('div', 'now');
    const mid = el('div');
    const title = el('div', 't');
    title.append(el('mark', 'hl', t.title));
    // The playing song needs only its artist; who added it matters in the queue, not here.
    mid.append(title, el('div', 's', t.artist), el('div', 's times'));
    const acts = el('div', 'acts');
    const pause = iconButton(t.paused ? 'play' : 'pause', t.paused ? 'Resume' : 'Pause');
    pause.addEventListener('click', () => api(t.paused ? '/resume' : '/pause', 'POST').then(render).catch(fail));
    // Skipping cuts the song for everyone, so it takes a second tap.
    const skip = iconButton('skip', 'Skip');
    let armed = false;
    skip.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        skip.className = 'btn sm quiet';
        skip.replaceChildren(document.createTextNode('Skip?'));
        setTimeout(() => { armed = false; skip.className = 'icon-btn'; setIcon(skip, 'skip'); }, 3000);
        return;
      }
      api(`/remove/${t.id}`, 'POST').then(render).catch(fail);
    });
    acts.append(pause, skip);
    const bar = el('div', 'bar');
    bar.append(el('i'));
    box.append(sleeve(t), mid, acts, bar);
    return box;
  };

  // One song in the queue or the history. Only a song that is not ready shows a status.
  const row = (t, done) => {
    const li = el('li', 'row' + (done ? ' done' : ''));
    const mid = el('div');
    mid.append(el('div', 't', t.title), el('div', 's', sub(t)));
    const acts = el('div', 'acts');
    const tag = stateTag(t);
    if (tag) acts.append(tag);
    if (!done) {
      const rm = iconButton('x', `Remove ${t.title}`);
      rm.addEventListener('click', () => api(`/remove/${t.id}`, 'POST').then(render).catch(fail));
      acts.append(rm);
    }
    li.append(sleeve(t), mid, acts);
    return li;
  };

  const empty = (...parts) => { const d = el('div', 'empty'); d.append(...parts); return d; };

  // The room clock: where the playing song is, advanced locally between polls.
  let clk = null;
  let remembered = null;
  const tickBar = () => {
    const i = document.querySelector('#now .bar i'), times = document.querySelector('#now .times');
    if (!i || !clk) return;
    const pos = clk.paused ? clk.pos : clk.pos + (performance.now() - clk.at) / 1000;
    const shown = clk.dur ? Math.min(pos, clk.dur) : pos;
    i.style.width = clk.dur ? `${Math.min(100, (shown / clk.dur) * 100)}%` : '0';
    times.textContent = clk.dur ? `${Jam.clock(shown)} / ${Jam.clock(clk.dur)}` : Jam.clock(shown);
  };
  setInterval(tickBar, 500);

  let last = '';
  const render = (s) => {
    rd.update(s.room);
    if (remembered !== s.room.name) { Jam.rooms.remember(code, s.room.name); remembered = s.room.name; }
    clk = s.now && { pos: s.now.position, at: performance.now(), paused: s.now.paused, dur: s.now.duration };
    const json = JSON.stringify({ ...s, now: s.now && { ...s.now, position: 0 } });
    if (json === last) { tickBar(); return; }
    last = json;
    $('room').textContent = s.room.name;
    document.title = `${s.room.name} · jamroom`;
    const now = $('now');
    now.textContent = '';
    if (s.now) now.append(nowRow(s.now));
    else {
      const a = el('a', null, 'Open the player');
      a.href = `/r/${code}/player`;
      now.append(empty('Nothing playing. ', a));
    }
    const q = $('q');
    q.textContent = '';
    $('qn').textContent = s.queue.length ? `· ${s.queue.length}` : '';
    if (s.queue.length) s.queue.forEach((t) => q.append(row(t, false)));
    else q.append(empty(s.room.autoplay ? 'Nothing queued. Autoplay is on.' : 'Nothing queued.'));
    const r = $('recent');
    r.textContent = '';
    if (s.recent.length) s.recent.forEach((t) => r.append(row(t, true)));
    else r.append(empty('Nothing yet.'));
    tickBar();
  };

  const rd = Jam.radio(api, (s) => render(s));
  $('radio').append(rd.button);
  const load = () => api('/state').then(render).catch(fail);

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('nm').value.trim();
    try { localStorage.setItem('jam-name', name); } catch (e2) {}
    $('add').disabled = true;
    say('Looking that up…');
    try {
      const r = await api('/add', 'POST', { input: $('in').value, name });
      say(r.added === 1 ? `Added “${r.first}”.` : `Added ${r.added} songs.`, 'ok');
      $('in').value = '';
      await load();
    } catch (err) {
      say(err.message, 'err');
    }
    $('add').disabled = false;
  });

  load(); Jam.every(2000, load); Jam.onWake(load);
})();
</script>
</body>
</html>
