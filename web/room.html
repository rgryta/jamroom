<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317173a'/%3E%3Crect x='6' y='13' width='20' height='8' rx='2' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
</head>
<body>
<header class="top">
  <a class="mark" href="/">jam<mark class="hl">room</mark></a>
  <a class="btn ghost sm" id="player" href="#">Open the player</a>
</header>
<main class="wrap">
  <h1 id="room">Jam</h1>

  <form id="f">
    <label class="lbl" for="in">Add a song</label>
    <div class="addrow">
      <input class="field" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="Paste a link or type a song name" aria-describedby="hint" required>
      <button class="btn" id="add">Add</button>
    </div>
    <p class="hint" id="hint">Links from YouTube, SoundCloud, Spotify or Tidal, or just the artist and title.</p>
    <details class="name">
      <summary id="who">Add your name</summary>
      <label>Your name <span class="count">(optional, shown next to your songs)</span>
        <input class="field" id="nm" maxlength="40" autocomplete="nickname">
      </label>
    </details>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <div id="sw"></div>

  <section aria-labelledby="h-now">
    <h2 id="h-now">Now playing</h2>
    <div id="now"></div>
  </section>
  <section aria-labelledby="h-q">
    <h2 id="h-q">Up next <span class="count" id="qn"></span></h2>
    <ol class="list" id="q"></ol>
  </section>
  <details class="recent">
    <summary>Played recently</summary>
    <ul class="list" id="recent"></ul>
  </details>
</main>
<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el, sleeve, chip } = Jam;
  const code = location.pathname.split('/')[2];
  const api = Jam.roomApi(code);
  const $ = (id) => document.getElementById(id);
  $('player').href = `/r/${code}/player`;

  const say = (text, cls) => { $('msg').textContent = text; $('msg').className = 'msg ' + (cls || ''); };
  const showName = () => { $('who').textContent = $('nm').value.trim() ? `Adding as ${$('nm').value.trim()}` : 'Add your name'; };
  try { $('nm').value = localStorage.getItem('jam-name') || ''; } catch (e) {}
  showName();
  $('nm').addEventListener('input', showName);

  // One queue row. `now` is the song playing, `done` a finished one.
  const row = (t, kind) => {
    const li = el('li', 'track' + (kind ? ' ' + kind : ''));
    const mid = el('div');
    const title = el('div', 'title');
    if (kind === 'now') title.append(el('mark', 'hl', t.title)); else title.textContent = t.title;
    mid.append(title, el('div', 'sub', [t.artist, t.added_by && `added by ${t.added_by}`].filter(Boolean).join(' · ')));
    if (kind === 'now') {
      const bar = el('div', 'bar'); bar.append(el('i'));
      mid.append(bar, el('div', 'sub times'));
    } else if (kind !== 'done' || t.status === 'failed') mid.append(chip(t));
    if (t.status === 'failed' && t.error) mid.append(el('div', 'sub', t.error));
    li.append(sleeve(t), mid);
    if (kind === 'done') { li.append(el('span')); return li; }

    const acts = el('div', 'acts');
    const fail = (e) => say(e.message, 'err');
    if (kind === 'now') {
      const p = el('button', 'btn ghost sm', t.paused ? 'Resume' : 'Pause');
      p.type = 'button';
      p.addEventListener('click', () => api(t.paused ? '/resume' : '/pause', 'POST').then(render).catch(fail));
      acts.append(p);
    }
    const b = el('button', 'btn ghost sm', t.status === 'playing' ? 'Skip' : 'Remove');
    b.type = 'button';
    b.setAttribute('aria-label', `${t.status === 'playing' ? 'Skip' : 'Remove'} ${t.title}`);
    // Skipping cuts the song for everyone, so it takes a second tap.
    let armed = false;
    b.addEventListener('click', () => {
      if (kind === 'now' && !armed) {
        armed = true; b.textContent = 'Tap again to skip';
        setTimeout(() => { armed = false; b.textContent = 'Skip'; }, 3000);
        return;
      }
      api(`/remove/${t.id}`, 'POST').then(render).catch(fail);
    });
    acts.append(b);
    li.append(acts);
    return li;
  };

  const empty = (...parts) => { const d = el('div', 'empty'); d.append(...parts); return d; };

  // The room clock: where the playing song is, advanced locally between polls.
  let clk = null;
  const tickBar = () => {
    const i = document.querySelector('#now .bar i'), times = document.querySelector('#now .times');
    if (!i || !clk) return;
    const pos = clk.paused ? clk.pos : clk.pos + (performance.now() - clk.at) / 1000;
    const shown = clk.dur ? Math.min(pos, clk.dur) : pos;
    i.style.width = clk.dur ? `${Math.min(100, (shown / clk.dur) * 100)}%` : '0';
    times.textContent = clk.dur ? `${Jam.clock(shown)} / ${Jam.clock(clk.dur)}` : Jam.clock(shown);
  };
  setInterval(tickBar, 500);

  let last = '';
  const render = (s) => {
    sw.update(s.room);
    clk = s.now && { pos: s.now.position, at: performance.now(), paused: s.now.paused, dur: s.now.duration };
    const json = JSON.stringify({ ...s, now: s.now && { ...s.now, position: 0 } });
    if (json === last) { tickBar(); return; }
    last = json;
    $('room').textContent = s.room.name;
    document.title = `${s.room.name} · jamroom`;
    const now = $('now'); now.textContent = '';
    if (s.now) { const ul = el('ul', 'list'); ul.append(row(s.now, 'now')); now.append(ul); }
    else {
      const a = el('a', null, 'Open the player'); a.href = `/r/${code}/player`;
      now.append(empty('Nothing is playing. Open the player on the computer that’s connected to the speakers. ', a));
    }
    const q = $('q'); q.textContent = '';
    $('qn').textContent = s.queue.length ? `(${s.queue.length})` : '';
    if (s.queue.length) s.queue.forEach((t) => q.append(row(t)));
    else q.append(empty(s.room.autoplay ? 'The queue is empty. Autoplay picks the next song when this one ends.' : 'The queue is empty. Add the first song above.'));
    tickBar();
    const r = $('recent'); r.textContent = '';
    if (s.recent.length) s.recent.forEach((t) => r.append(row(t, 'done')));
    else r.append(empty('Nothing has played yet.'));
  };

  const sw = Jam.switches(api, (s) => render(s));
  $('sw').append(sw.node);
  const load = () => api('/state').then(render).catch((e) => say(e.message, 'err'));

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('nm').value.trim();
    try { localStorage.setItem('jam-name', name); } catch (e2) {}
    $('add').disabled = true; say('Looking that up…');
    try {
      const r = await api('/add', 'POST', { input: $('in').value, name });
      say(r.added === 1 ? `Added “${r.first}”.` : `Added ${r.added} songs.`, 'ok');
      $('in').value = '';
      await load();
    } catch (err) {
      say(err.message, 'err');
    }
    $('add').disabled = false;
  });

  load(); Jam.every(2000, load); Jam.onWake(load);
})();
</script>
</body>
</html>
