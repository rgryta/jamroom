<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a45e0'/%3E%3Ccircle cx='12.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='19.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
<style>
  .start { padding-top: 6vh; }
  #recent { margin-top: 24px; }
  .code { letter-spacing: .06em; font-weight: 600; }
</style>
</head>
<body>
<header class="top"><span class="mark"><svg viewBox="0 0 28 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="18" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>jamroom</span></header>
<main class="wrap start">
  <h1>Join the jam</h1>

  <form id="f" class="addbar" novalidate>
    <input class="code" id="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Room code or link" aria-label="Room code or link" aria-describedby="msg" required>
    <button class="btn" id="go">Join</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <section id="recent" aria-labelledby="h-recent" hidden>
    <div class="sec"><h2 id="h-recent">Recent rooms</h2></div>
    <ul class="list" id="rl"></ul>
    <p class="msg" id="rmsg" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el, iconButton } = Jam;
  const $ = (id) => document.getElementById(id);
  const say = (text, cls, id = 'msg') => { $(id).textContent = text; $(id).className = 'msg ' + (cls || ''); };
  // Accepts the bare code, or a pasted room link.
  const clean = (v) => { const m = v.match(/\/r\/([a-z0-9]+)/i); return (m ? m[1] : v).trim().toLowerCase().replace(/\s+/g, ''); };

  // The rooms this browser joined lately, newest first. They are kept only in this browser.
  const draw = () => {
    const rooms = Jam.rooms.list();
    $('recent').hidden = !rooms.length;
    const ul = $('rl');
    ul.textContent = '';
    rooms.forEach((r) => {
      const li = el('li', 'room-row');
      const text = el('div');
      text.append(el('div', 't', r.name), el('div', 's', `${r.code} · ${Jam.ago(r.at)}`));
      const join = el('button', 'btn tonal sm', 'Join');
      join.type = 'button';
      join.setAttribute('aria-label', `Join ${r.name}`);
      join.addEventListener('click', () => enter(r.code, true));
      const forget = iconButton('x', `Forget ${r.name}`);
      forget.addEventListener('click', () => { Jam.rooms.forget(r.code); draw(); say('', '', 'rmsg'); });
      li.append(text, join, forget);
      ul.append(li);
    });
  };

  // Check the room exists, then go in. A room that is gone is dropped from the list.
  const enter = async (code, fromList) => {
    const id = fromList ? 'rmsg' : 'msg';
    document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    say(fromList ? 'Opening the room…' : 'Checking the code…', '', id);
    try {
      await Jam.roomApi(code)('/state');
      location.href = '/r/' + code;
    } catch (err) {
      document.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      if (err.status === 404 && fromList) {
        Jam.rooms.forget(code);
        draw();
        say('That room is gone, so it was removed from the list.', 'err', 'rmsg');
      } else {
        say(err.status === 404 ? 'No room with that code.'
          : err.status === 429 ? 'Too many wrong codes. Wait a minute.'
          : 'Can’t reach the server.', 'err', id);
        if (!fromList) $('code').focus();
      }
    }
  };

  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = clean($('code').value);
    if (!code) { say('Enter the room code.', 'err'); $('code').focus(); return; }
    enter(code, false);
  });

  draw();
  window.addEventListener('pageshow', draw);   // coming back with the back button
})();
</script>
</body>
</html>
