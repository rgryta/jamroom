<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317173a'/%3E%3Crect x='6' y='13' width='20' height='8' rx='2' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
<style>
  .join { padding-top: 8vh; }
  #recent { margin-bottom: 28px; }
  #recent h2 { margin-top: 0; }
  .join .field { font-size: 1.5rem; font-weight: 700; letter-spacing: .08em; min-height: 64px; }
  .join form .btn { width: 100%; margin-top: 12px; min-height: 56px; font-size: 1.125rem; }
</style>
</head>
<body>
<header class="top"><span class="mark">jam<mark class="hl">room</mark></span></header>
<main class="wrap join">
  <h1>Join the jam</h1>

  <section id="recent" aria-labelledby="h-recent" hidden>
    <h2 id="h-recent">Your recent rooms</h2>
    <ul class="list" id="rl"></ul>
    <p class="msg" id="rmsg" role="status" aria-live="polite"></p>
  </section>

  <form id="f" novalidate>
    <label class="lbl" for="code">Room code</label>
    <input class="field" id="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="hint msg" required>
    <p class="hint" id="hint">The 10-character code from whoever started the jam. You can paste the whole room link too.</p>
    <button class="btn" id="go">Join room</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el } = Jam;
  const $ = (id) => document.getElementById(id);
  const say = (text, cls, id = 'msg') => { $(id).textContent = text; $(id).className = 'msg ' + (cls || ''); };
  // Accepts the bare code, or a pasted room link.
  const clean = (v) => { const m = v.match(/\/r\/([a-z0-9]+)/i); return (m ? m[1] : v).trim().toLowerCase().replace(/\s+/g, ''); };

  // The rooms this browser joined lately, newest first. They are kept only in this browser.
  const draw = () => {
    const rooms = Jam.rooms.list();
    $('recent').hidden = !rooms.length;
    const ul = $('rl');
    ul.textContent = '';
    rooms.forEach((r) => {
      const li = el('li', 'room-item');
      const text = el('div');
      text.append(el('div', 'title', r.name), el('div', 'sub', `${r.code} · ${Jam.ago(r.at)}`));
      const join = el('button', 'btn sm', 'Join');
      join.type = 'button';
      join.setAttribute('aria-label', `Join ${r.name}`);
      join.addEventListener('click', () => enter(r.code, true));
      const forget = el('button', 'btn ghost sm', 'Forget');
      forget.type = 'button';
      forget.setAttribute('aria-label', `Forget ${r.name}`);
      forget.addEventListener('click', () => { Jam.rooms.forget(r.code); draw(); say('', '', 'rmsg'); });
      li.append(text, join, forget);
      ul.append(li);
    });
  };

  // Check the room exists, then go in. A room that is gone is dropped from the list.
  const enter = async (code, fromList) => {
    const id = fromList ? 'rmsg' : 'msg';
    document.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    say(fromList ? 'Opening the room…' : 'Checking the code…', '', id);
    try {
      await Jam.roomApi(code)('/state');
      location.href = '/r/' + code;
    } catch (err) {
      document.querySelectorAll('button').forEach((b) => { b.disabled = false; });
      if (err.status === 404 && fromList) {
        Jam.rooms.forget(code);
        draw();
        say('That room doesn’t exist any more, so it was removed from your list.', 'err', 'rmsg');
      } else {
        say(err.status === 404 ? 'No room with that code. Check it and try again.'
          : err.status === 429 ? 'Too many wrong codes. Wait a minute, then try again.'
          : 'Can’t reach the server. Check your connection and try again.', 'err', id);
        if (!fromList) $('code').focus();
      }
    }
  };

  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = clean($('code').value);
    if (!code) { say('Enter the room code.', 'err'); $('code').focus(); return; }
    enter(code, false);
  });

  draw();
  window.addEventListener('pageshow', draw);   // coming back with the back button
})();
</script>
</body>
</html>
