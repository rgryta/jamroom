<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a45e0'/%3E%3Ccircle cx='12.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='19.5' cy='16' r='6.2' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
<style>
  /* The player is sized from the screen, so it fits without scrolling. Everything is in rem, so a
     TV or projector (the root size grows above 1700 px wide) scales it all together. */
  .stage { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; gap: clamp(8px, 2vh, 24px); padding: clamp(12px, 2.5vh, 28px) clamp(16px, 3vw, 40px); }
  .stage.gate { grid-template-rows: 1fr; place-items: center; }
  .gate-box { max-width: 24rem; }
  .gate-box p { margin: 8px 0 20px; color: var(--mut); }
  .gate-box .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .deck-top { display: flex; align-items: center; gap: 4px; }
  .deck-top .room { color: var(--mut); font-weight: 600; margin-right: 4px; }
  .nowp { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: clamp(20px, 4vw, 56px); min-height: 0; }
  .nowp > * { min-width: 0; }
  .art .sleeve { width: min(44vh, 34vw, 26rem); border-radius: 14px; }
  .np-title { margin: 0 0 6px; font: 700 clamp(1.5rem, 1rem + 2.4vw, 2.75rem)/1.12 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .np-artist { margin: 0; font-size: var(--t4); color: var(--mut); }
  .np-artist small { font-size: var(--t2); }
  .seek { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin: clamp(12px, 3vh, 28px) 0 8px; font-size: var(--t2); color: var(--mut); font-variant-numeric: tabular-nums; }
  .seek input { width: 100%; height: 24px; accent-color: var(--ink); }
  .transport { display: flex; align-items: center; gap: 12px; }
  .status { min-height: 1.3em; margin: 8px 0 0; color: var(--mut); font-size: var(--t2); font-weight: 600; }
  .status.err { color: var(--bad); }
  .next { display: flex; align-items: center; gap: 16px; min-height: 0; border-top: 1px solid var(--line); padding-top: clamp(8px, 1.5vh, 16px); }
  .next .label { color: var(--mut); font-size: var(--t2); font-weight: 600; white-space: nowrap; }
  .strip { list-style: none; margin: 0; padding: 0; display: flex; gap: 20px; flex: 1; min-width: 0; overflow: hidden; }
  .strip li { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 0 1 16rem; }
  .strip .sleeve { width: 36px; border-radius: 6px; }
  .strip .t { font-size: var(--t2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip .s { font-size: var(--t1); color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip .none { color: var(--mut); font-size: var(--t2); }
  @media (max-width: 719px) {
    .nowp { grid-template-columns: 1fr; align-content: center; gap: 16px; }
    .art .sleeve { width: min(62vw, 34vh); }
    .strip li:nth-child(n+3) { display: none; }
  }
  @media (max-height: 520px) { .next { display: none; } }
</style>
</head>
<body>
<section class="stage gate" id="gate">
  <div class="gate-box">
    <h1>Start the player</h1>
    <p>Plays here, in time with every other player in the room.</p>
    <div class="buttons">
      <button class="btn" id="start">Start player</button>
      <a class="btn quiet" id="gate-room" href="#">Add songs instead</a>
    </div>
  </div>
</section>

<section class="stage" id="deck" hidden>
  <header class="deck-top">
    <span class="room" id="roomname"></span>
    <span class="grow"></span>
    <a class="icon-btn" id="to-room" href="#" aria-label="Add songs" title="Add songs"></a>
    <button class="icon-btn" id="copy" type="button" aria-label="Copy the room link" title="Copy the room link"></button>
    <span id="radio"></span>
  </header>

  <main class="nowp">
    <div class="art" id="art"></div>
    <div>
      <h1 class="np-title"><mark class="hl" id="tt"></mark><span id="idle"></span></h1>
      <p class="np-artist" id="artist"></p>
      <div class="seek">
        <span id="t0">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled>
        <span id="t1">0:00</span>
      </div>
      <div class="transport">
        <button class="icon-btn main" id="pp" type="button" aria-label="Pause" disabled></button>
        <button class="icon-btn" id="skip" type="button" aria-label="Skip" title="Skip" disabled></button>
        <button class="btn sm" id="tap" type="button" hidden>Tap to hear it</button>
      </div>
      <p class="status" id="net" role="status" aria-live="polite"></p>
    </div>
  </main>

  <footer class="next">
    <span class="label">Up next</span>
    <ol class="strip" id="next"></ol>
  </footer>
</section>
<audio id="a" preload="auto"></audio>
<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el, sleeve, roomApi, clock, icon, setIcon } = Jam;
  const code = location.pathname.split('/')[2];
  const api = roomApi(code);
  const $ = (id) => document.getElementById(id);
  const a = $('a');
  const room = `${location.origin}/r/${code}`;
  $('gate-room').href = `/r/${code}`;
  $('to-room').href = `/r/${code}`;
  $('to-room').append(icon('plus'));
  $('copy').append(icon('copy'));
  setIcon($('pp'), 'pause');
  setIcon($('skip'), 'skip');

  let remembered = null;
  // Opening the player counts as joining the room, even before Start is pressed.
  api('/state').then((s) => { Jam.rooms.remember(code, s.room.name); remembered = s.room.name; }).catch(() => {});
  let started = false, cur = null, sync = null, seq = 0, applied = 0, last = '', dragging = false, lock = null, recovering = false;

  // Where the room says the song is right now, kept up to date between polls with the local clock.
  const expected = () => (!sync ? 0 : sync.paused ? sync.pos : sync.pos + (performance.now() - sync.at) / 1000);
  const length = () => (Number.isFinite(a.duration) && a.duration > 0 ? a.duration : (sync && sync.dur) || 0);
  const mediaUrl = () => `/media/${code}/${cur}`;
  const say = (text, bad) => { $('net').textContent = text; $('net').className = 'status' + (bad ? ' err' : ''); };

  // Bring this device in line with the room: same song, same spot, playing or paused like everyone else.
  const follow = () => {
    if (!sync || cur === null || !started) return;
    const want = expected();
    if (a.readyState >= 1 && !a.seeking && Math.abs(a.currentTime - want) > (sync.paused ? 0.3 : 0.8) && (!length() || want < length())) a.currentTime = want;
    if (sync.paused) { if (!a.paused) a.pause(); }
    else if (a.paused && !a.ended) a.play().then(() => { $('tap').hidden = true; }).catch(() => { $('tap').hidden = false; });
  };

  const upNext = (s) => {
    const list = $('next');
    list.textContent = '';
    const up = s.queue.filter((t) => !s.now || t.id !== s.now.id);
    if (!up.length) { list.append(el('li', 'none', s.room.autoplay ? 'Autoplay picks the next song' : 'Nothing queued')); return; }
    up.slice(0, 4).forEach((t) => {
      const li = el('li');
      const text = el('div');
      text.style.minWidth = '0';
      text.append(el('div', 't', t.title), el('div', 's', t.artist));
      li.append(sleeve(t), text);
      list.append(li);
    });
  };

  const show = (s, delay) => {
    rd.update(s.room);
    const now = s.now;
    sync = now && { id: now.id, pos: now.position + (now.paused ? 0 : delay), at: performance.now(), paused: now.paused, dur: now.duration };
    if (now && now.id !== cur) {
      cur = now.id;
      a.src = mediaUrl();
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: now.title, artist: now.artist, album: now.album || '',
          artwork: now.cover ? [{ src: now.cover }] : [],
        });
      }
    } else if (!now && cur !== null) {
      cur = null; a.pause(); a.removeAttribute('src'); a.load();
    }
    if (remembered !== s.room.name) { Jam.rooms.remember(code, s.room.name); remembered = s.room.name; }
    const key = JSON.stringify({ r: s.room, n: now && { ...now, position: 0 }, q: s.queue.map((t) => [t.id, t.status]) });
    if (key !== last) {
      last = key;
      $('roomname').textContent = s.room.name;
      document.title = now ? `${now.title} · jamroom` : 'jamroom player';
      $('tt').textContent = now ? now.title : '';
      $('idle').textContent = now ? '' : s.queue.length ? 'Getting the next song ready…' : s.room.autoplay ? 'Picking the next song…' : 'Waiting for songs';
      $('artist').textContent = '';
      if (now) {
        $('artist').append(document.createTextNode(now.artist));
        if (now.added_by) $('artist').append(el('small', null, `  ·  added by ${now.added_by}`));
      }
      $('art').textContent = '';
      $('art').append(sleeve(now || { title: 'jamroom', artist: '' }));
      upNext(s);
    }
    const paused = !!(now && now.paused);
    $('pp').disabled = $('skip').disabled = $('seek').disabled = !now;
    setIcon($('pp'), paused ? 'play' : 'pause');
    $('pp').setAttribute('aria-label', paused ? 'Play' : 'Pause');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = !now ? 'none' : paused ? 'paused' : 'playing';
    follow();
  };

  // Every call goes through here. An answer that arrives after a newer one is dropped, so a slow
  // reply can never put the player back on a song that has already moved on.
  const run = async (path, method) => {
    const mine = ++seq, t0 = performance.now();
    try {
      const s = await api(path, method);
      if (recovering) { recovering = false; say(''); }
      if (mine < applied) return s;
      applied = mine;
      show(s, (performance.now() - t0) / 2000);
      return s;
    } catch (e) {
      say('Can’t reach the server. Playing on.', true);
      recovering = true;
    }
  };

  const poll = async () => {
    const s = await run('/state');
    if (s && !s.now && (s.queue.length || s.room.autoplay)) await run('/advance', 'POST');
  };

  const rd = Jam.radio(api, (s) => show(s, 0));
  $('radio').append(rd.button);

  const skip = () => { if (cur !== null) run(`/next?done=${cur}`, 'POST'); };
  const toggle = () => { if (sync) run(sync.paused ? '/resume' : '/pause', 'POST'); };

  a.addEventListener('ended', skip);
  a.addEventListener('loadedmetadata', follow);
  a.addEventListener('canplay', () => { if (!recovering) say(''); follow(); });
  a.addEventListener('waiting', () => { if (cur !== null) say('Buffering…'); });
  a.addEventListener('playing', () => say(''));
  // Paused by something other than the room (a browser hiccup, a Bluetooth blip): rejoin.
  a.addEventListener('pause', () => { if (sync && !sync.paused && !a.ended) setTimeout(follow, 400); });
  a.addEventListener('error', async () => {
    const failed = cur;
    if (failed === null) return;
    await new Promise((r) => setTimeout(r, 1500));
    if (cur !== failed) return;
    let gone = false;
    try { gone = (await fetch(mediaUrl(), { method: 'HEAD' })).status === 404; } catch (e) {}
    if (gone) { say('That song is no longer available. Skipping.', true); skip(); return; }
    say('Connection lost. Trying again…', true);
    a.src = mediaUrl();
  });
  a.addEventListener('timeupdate', () => {
    $('t0').textContent = clock(a.currentTime);
    $('t1').textContent = length() ? `-${clock(length() - a.currentTime)}` : '';
    if (!dragging && length()) $('seek').value = Math.round((a.currentTime / length()) * 1000);
  });

  $('seek').addEventListener('input', () => { dragging = true; $('t0').textContent = clock(($('seek').value / 1000) * length()); });
  $('seek').addEventListener('change', () => { dragging = false; run(`/seek?to=${(($('seek').value / 1000) * length()).toFixed(2)}`, 'POST'); });
  $('pp').addEventListener('click', toggle);
  $('skip').addEventListener('click', skip);
  $('tap').addEventListener('click', follow);
  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText(room).then(() => {
      $('copy').title = 'Copied';
      setTimeout(() => { $('copy').title = 'Copy the room link'; }, 2000);
    }).catch(() => {});
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && started && !/^(INPUT|BUTTON|A|DIALOG)$/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); toggle(); }
  });

  // Keeps the screen (and so the computer) awake; the browser drops the lock when the tab is hidden.
  const keepAwake = async () => { try { lock = await navigator.wakeLock.request('screen'); } catch (e) {} };
  document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') { keepAwake(); follow(); } });

  if ('mediaSession' in navigator) {
    const on = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) {} };
    on('play', () => run('/resume', 'POST'));
    on('pause', () => run('/pause', 'POST'));
    on('nexttrack', skip);
    on('seekto', (d) => run(`/seek?to=${d.seekTime}`, 'POST'));
  }

  $('start').addEventListener('click', () => {
    started = true; $('gate').hidden = true; $('deck').hidden = false;
    a.play().catch(() => {});   // unlocks sound for the rest of the session
    keepAwake();
    poll(); Jam.every(1500, poll); Jam.onWake(poll);
  });
})();
</script>
</body>
</html>
