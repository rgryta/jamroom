<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jamroom player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317173a'/%3E%3Crect x='6' y='13' width='20' height='8' rx='2' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/jam.css">
<style>
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .gate { max-width: 520px; }
  .gate p { color: var(--mut); margin: 0 0 24px; max-width: 46ch; }
  .deck { width: min(1120px, 100%); display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { .deck { grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); gap: 48px; align-items: center; } }
  .art .sleeve { width: 100%; border-radius: 20px; box-shadow: 0 24px 60px -24px rgba(23, 23, 58, .5); }
  .room { color: var(--mut); font-weight: 600; margin: 0 0 6px; }
  .now-title { font: 800 clamp(2rem, 5.5vw, 4.25rem)/1.15 var(--display); letter-spacing: -.035em; margin: 0 0 10px; overflow-wrap: anywhere; }
  .artist { font-size: clamp(1.125rem, 2.2vw, 1.5rem); color: var(--mut); margin: 0; }
  .by { color: var(--mut); font-size: .9375rem; margin: 4px 0 0; }
  .transport { display: flex; gap: 12px; align-items: center; margin: 24px 0 12px; flex-wrap: wrap; }
  .seek { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-variant-numeric: tabular-nums; color: var(--mut); }
  .seek input { width: 100%; accent-color: var(--act); height: 28px; }
  .status { min-height: 1.5em; margin: 8px 0 0; color: var(--mut); font-weight: 600; }
  .status.err { color: var(--bad); }
  .upnext .track { grid-template-columns: 48px minmax(0, 1fr) auto; }
  .join { margin-top: 28px; color: var(--mut); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .join a { font-weight: 700; word-break: break-all; }
</style>
</head>
<body>
<main class="stage">
  <section class="gate" id="gate">
    <h1>Start the player</h1>
    <p>Press once so this tab is allowed to play sound, then leave it open on the computer that&rsquo;s connected to the speakers. The screen stays awake while it plays. Every player in the room stays in time with the others.</p>
    <button class="btn big" id="start">Start player</button>
  </section>

  <section class="deck" id="deck" hidden>
    <div class="art" id="art"></div>
    <div>
      <p class="room" id="roomname"></p>
      <h1 class="now-title"><mark class="hl" id="tt"></mark><span id="idle"></span></h1>
      <p class="artist" id="artist"></p>
      <p class="by" id="by"></p>

      <div class="transport">
        <button class="btn big" id="pp" disabled>Pause</button>
        <button class="btn ghost big" id="skip" disabled>Skip</button>
        <button class="btn ghost big" id="tap" hidden>Tap to hear it</button>
      </div>
      <div class="seek">
        <span id="t0">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled>
        <span id="t1">0:00</span>
      </div>
      <p class="status" id="net" role="status" aria-live="polite"></p>

      <div id="sw"></div>

      <div class="upnext">
        <h2>Up next</h2>
        <ol class="list" id="next"></ol>
      </div>
      <p class="join">Add songs at <a id="join" href="#"></a> <button class="btn ghost sm" id="copy" type="button">Copy link</button></p>
    </div>
  </section>
</main>
<audio id="a" preload="auto"></audio>
<script src="/assets/jam.js"></script>
<script>
(() => {
  const { el, sleeve, roomApi, clock, chip } = Jam;
  const code = location.pathname.split('/')[2];
  const api = roomApi(code);
  const $ = (id) => document.getElementById(id);
  const a = $('a');
  const room = `${location.origin}/r/${code}`;
  $('join').href = room; $('join').textContent = room.replace(/^https?:\/\//, '');

  let started = false, cur = null, sync = null, seq = 0, applied = 0, last = '', dragging = false, lock = null, recovering = false;

  // Where the room says the song is right now, kept up to date between polls with the local clock.
  const expected = () => (!sync ? 0 : sync.paused ? sync.pos : sync.pos + (performance.now() - sync.at) / 1000);
  const length = () => (Number.isFinite(a.duration) && a.duration > 0 ? a.duration : (sync && sync.dur) || 0);
  const mediaUrl = () => `/media/${code}/${cur}`;
  const say = (text, bad) => { $('net').textContent = text; $('net').className = 'status' + (bad ? ' err' : ''); };

  // Bring this device in line with the room: same song, same spot, playing or paused like everyone else.
  const follow = () => {
    if (!sync || cur === null || !started) return;
    const want = expected();
    if (a.readyState >= 1 && !a.seeking && Math.abs(a.currentTime - want) > (sync.paused ? 0.3 : 0.8) && (!length() || want < length())) a.currentTime = want;
    if (sync.paused) { if (!a.paused) a.pause(); }
    else if (a.paused && !a.ended) a.play().then(() => { $('tap').hidden = true; }).catch(() => { $('tap').hidden = false; });
  };

  const upNext = (s) => {
    const list = $('next'); list.textContent = '';
    const up = s.queue.filter((t) => !s.now || t.id !== s.now.id);
    if (!up.length) { list.append(el('li', 'empty', s.room.autoplay ? 'Nothing queued. Autoplay picks the next song.' : 'Nothing queued. Add a song from your phone.')); return; }
    up.slice(0, 5).forEach((t) => {
      const li = el('li', 'track');
      const mid = el('div');
      mid.append(el('div', 'title', t.title), el('div', 'sub', t.artist));
      li.append(sleeve(t), mid, chip(t));
      list.append(li);
    });
    if (up.length > 5) list.append(el('li', 'sub', `and ${up.length - 5} more`));
  };

  const show = (s, delay) => {
    sw.update(s.room);
    const now = s.now;
    sync = now && { id: now.id, pos: now.position + (now.paused ? 0 : delay), at: performance.now(), paused: now.paused, dur: now.duration };
    if (now && now.id !== cur) {
      cur = now.id;
      a.src = mediaUrl();
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: now.title, artist: now.artist, album: now.album || '',
          artwork: now.cover ? [{ src: now.cover }] : [],
        });
      }
    } else if (!now && cur !== null) {
      cur = null; a.pause(); a.removeAttribute('src'); a.load();
    }
    const key = JSON.stringify({ r: s.room, n: now && { ...now, position: 0 }, q: s.queue.map((t) => [t.id, t.status]) });
    if (key !== last) {
      last = key;
      $('roomname').textContent = s.room.name;
      document.title = now ? `${now.title} · jamroom` : 'jamroom player';
      $('tt').textContent = now ? now.title : '';
      $('idle').textContent = now ? '' : s.queue.length ? 'Getting the next song ready…' : s.room.autoplay ? 'Picking the next song…' : 'Waiting for songs';
      $('artist').textContent = now ? now.artist : '';
      $('by').textContent = now && now.added_by ? `added by ${now.added_by}` : '';
      $('art').textContent = '';
      $('art').append(sleeve(now || { title: 'jamroom', artist: '' }));
      upNext(s);
    }
    $('pp').disabled = $('skip').disabled = $('seek').disabled = !now;
    $('pp').textContent = now && now.paused ? 'Play' : 'Pause';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = !now ? 'none' : now.paused ? 'paused' : 'playing';
    follow();
  };

  // Every call goes through here. An answer that arrives after a newer one is dropped, so a slow
  // reply can never put the player back on a song that has already moved on.
  const run = async (path, method) => {
    const mine = ++seq, t0 = performance.now();
    try {
      const s = await api(path, method);
      if (recovering) { recovering = false; say(''); }
      if (mine < applied) return s;
      applied = mine;
      show(s, (performance.now() - t0) / 2000);
      return s;
    } catch (e) {
      say('Can’t reach the server. Playing on and catching up when it’s back.', true);
      recovering = true;
    }
  };

  const poll = async () => {
    const s = await run('/state');
    if (s && !s.now && (s.queue.length || s.room.autoplay)) await run('/advance', 'POST');
  };

  const sw = Jam.switches(api, (s) => show(s, 0));
  $('sw').append(sw.node);

  const skip = () => { if (cur !== null) run(`/next?done=${cur}`, 'POST'); };
  const toggle = () => { if (sync) run(sync.paused ? '/resume' : '/pause', 'POST'); };

  a.addEventListener('ended', skip);
  a.addEventListener('loadedmetadata', follow);
  a.addEventListener('canplay', () => { if (!recovering) say(''); follow(); });
  a.addEventListener('waiting', () => say('Buffering…'));
  a.addEventListener('playing', () => say(''));
  // Paused by something other than the room (a browser hiccup, a Bluetooth blip): rejoin.
  a.addEventListener('pause', () => { if (sync && !sync.paused && !a.ended) setTimeout(follow, 400); });
  a.addEventListener('error', async () => {
    const failed = cur;
    if (failed === null) return;
    await new Promise((r) => setTimeout(r, 1500));
    if (cur !== failed) return;
    let gone = false;
    try { gone = (await fetch(mediaUrl(), { method: 'HEAD' })).status === 404; } catch (e) {}
    if (gone) { say('That song is no longer available. Skipping.', true); skip(); return; }
    say('Connection lost. Trying again…', true);
    a.src = mediaUrl();
  });
  a.addEventListener('timeupdate', () => {
    $('t0').textContent = clock(a.currentTime);
    $('t1').textContent = length() ? `-${clock(length() - a.currentTime)}` : '';
    if (!dragging && length()) $('seek').value = Math.round((a.currentTime / length()) * 1000);
  });

  $('seek').addEventListener('input', () => { dragging = true; $('t0').textContent = clock(($('seek').value / 1000) * length()); });
  $('seek').addEventListener('change', () => { dragging = false; run(`/seek?to=${(($('seek').value / 1000) * length()).toFixed(2)}`, 'POST'); });
  $('pp').addEventListener('click', toggle);
  $('skip').addEventListener('click', skip);
  $('tap').addEventListener('click', follow);
  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText(room).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy link'; }, 2000); }).catch(() => {});
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && started && !/^(INPUT|BUTTON|A)$/.test(document.activeElement.tagName)) { e.preventDefault(); toggle(); }
  });

  // Keeps the screen (and so the computer) awake; the browser drops the lock when the tab is hidden.
  const keepAwake = async () => { try { lock = await navigator.wakeLock.request('screen'); } catch (e) {} };
  document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') { keepAwake(); follow(); } });

  if ('mediaSession' in navigator) {
    const on = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) {} };
    on('play', () => run('/resume', 'POST'));
    on('pause', () => run('/pause', 'POST'));
    on('nexttrack', skip);
    on('seekto', (d) => run(`/seek?to=${d.seekTime}`, 'POST'));
  }

  $('start').addEventListener('click', () => {
    started = true; $('gate').hidden = true; $('deck').hidden = false;
    a.play().catch(() => {});   // unlocks sound for the rest of the session
    keepAwake();
    poll(); Jam.every(1500, poll); Jam.onWake(poll);
  });
})();
</script>
</body>
</html>
